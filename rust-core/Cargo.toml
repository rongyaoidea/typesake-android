[package]
name = "typesake-core"
version = "0.2.0"
edition = "2021"
description = "Typesake Android offline language engine: pinyin IME + Chinese->English suggestion + save & grammar"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "typesake_core"

[features]
default = []
# 三元组联想：体积 +13.5MB/ABI，CI 只对 arm64 开启
trigrams = ["inputx-pinyin/trigrams"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real Mandarin IME engine: 165k-entry FST dict, DP segmentation, Viterbi
# composition, bigram next-word prediction, L0 user-learning layer.
# trigrams (13.5MB) intentionally off to keep the .so small.
inputx-pinyin = { version = "=1.4.0", default-features = false, features = ["bigrams"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
