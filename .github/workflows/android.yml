name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# 三个 job：
# - rust : 引擎质量门禁（fmt / clippy / 单测）
# - test : Kotlin 单测 + lint
# - apk  : 产出可安装 APK —— 必须等 rust + test 全绿（测试红了不出包）
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      # 生成 lex.bin/gram.bin，让混简拼等端到端用例在 CI 真正执行。
      # 失败时显式标注 SKIPPED（原来静默跳过，绿但空心）。
      - name: "rust: build lexicon for tests"
        continue-on-error: true
        run: |
          curl -sSL --proto "=https" --max-time 120 -o /tmp/jieba_dict.txt \
            https://raw.githubusercontent.com/fxsjy/jieba/master/jieba/dict.txt
          cargo run --release --manifest-path rust-core/Cargo.toml --bin lexgen -- \
            --input /tmp/jieba_dict.txt --out app/src/main/assets/lex.bin

      - name: "rust: report optional assets"
        if: always()
        run: |
          for f in app/src/main/assets/lex.bin app/src/main/assets/sentbank.bin; do
            if [ -f "$f" ]; then echo "asset: $f present ($(du -h "$f" | cut -f1))"; else echo "::warning title=SKIPPED optional asset::$f 缺失，相关端到端用例将跳过"; fi
          done

      - name: cargo test
        run: cargo test --manifest-path rust-core/Cargo.toml --release

      # 回放评测：改键位表/排序后先跑它（top-1/top-5 阈值断言，防排序回退）。
      - name: replay eval (top-1/top-5)
        run: cargo run --release --manifest-path rust-core/Cargo.toml --bin replay -- --limit 500 --scheme 1

      # 出货 ABI（arm64 trigrams）至少编译+联想用例跑过：测的必须覆盖发的。
      - name: cargo test --features trigrams
        run: cargo test --manifest-path rust-core/Cargo.toml --release --features trigrams

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 失败即 red（本 job 负责暴露问题），但不影响 apk job 出包
      - name: Kotlin unit tests + lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload test / lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html

  apk:
    needs: [rust, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      # ---- 引擎 .so：缺失即失败（debug 与 release 同闸，残引擎不再出包） ----
      # 扩展词库（可选）：下载 jieba 词库并生成 lex.bin（失败不阻塞，APK 退回内置 16.5 万词库）
      - name: Build extended lexicon (optional)
        continue-on-error: true
        run: |
          curl -sSL --proto "=https" --max-time 120 -o /tmp/jieba_dict.txt \
            https://raw.githubusercontent.com/fxsjy/jieba/master/jieba/dict.txt
          cargo run --release --manifest-path rust-core/Cargo.toml --bin lexgen -- \
            --input /tmp/jieba_dict.txt --out app/src/main/assets/lex.bin
          ls -lh app/src/main/assets/lex.bin

      # 句库（可选）：Tatoeba 中英对齐句对 -> sentbank.bin（失败不阻塞）
      - name: Build sentence bank (optional)
        continue-on-error: true
        run: |
          curl -sSL --proto "=https" --max-time 180 -o /tmp/tatoeba.zip \
            https://object.pouta.csc.fi/OPUS-Tatoeba/v2023-04-12/moses/en-zh_cn.txt.zip
          unzip -o -q /tmp/tatoeba.zip -d /tmp/tatoeba
          python3 tools/gen_sentbank.py \
            --en /tmp/tatoeba/Tatoeba.en-zh_cn.en \
            --zh /tmp/tatoeba/Tatoeba.en-zh_cn.zh_cn \
            --out app/src/main/assets/sentbank.bin
          ls -lh app/src/main/assets/sentbank.bin

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust .so for 3 ABIs
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # arm64 独享 trigrams（联想更准，体积 +13.5MB）；其余 ABI 不带
          if [ "1" = "1" ]; then
            cargo ndk -o ../app/src/main/jniLibs -t arm64-v8a build --release --features trigrams
          fi
          cargo ndk -o ../app/src/main/jniLibs \
            -t armeabi-v7a -t x86_64 \
            build --release
          # cargo-ndk 会把依赖中的 cdylib 一起拷进来，只保留本引擎
          find ../app/src/main/jniLibs -name '*.so' ! -name 'libtypesake_core.so' -delete
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Check engine presence
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app/src/main/jniLibs/$abi/libtypesake_core.so" ]; then
              echo "engine: $abi present"
            else
              echo "::error title=Rust engine missing::$abi 缺 libtypesake_core.so，停止出包"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # debug 与 release 同闸：lint+单测失败即红，不出包。
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Assert APK contains all ABIs
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$abi/libtypesake_core.so"; then
              echo "apk: $abi ok"
            else
              echo "::error title=APK missing ABI::$abi 未打进 APK"
              exit 1
            fi
          done


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typesake-debug-apk
          path: app/build/outputs/apk/debug/*.apk
